name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Show repository structure
        run: |
          echo "=== Repository ==="
          find . -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        run: |
          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "./android/gradlew" ]; then
            echo "PROJECT_DIR=./android" >> "$GITHUB_ENV"
          else
            echo "ERROR: No gradlew found."
            echo "Your Android project is missing the Gradle wrapper."
            exit 1
          fi

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
